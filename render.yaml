services:
  # Backend Web Service
  - type: web
    name: nexa-backend
    env: node
    plan: free
    region: singapore # Closest Render region to MongoDB Atlas cluster in Mumbai (asia-south1), slashing cross-continental latency from ~250ms to ~40ms
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: AI_API_KEY
        sync: false

  # Frontend Static Site
  - type: web
    name: nexa-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
