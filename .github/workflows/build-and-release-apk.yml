name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Override Version Name (e.g. 1.0.2 - leave empty to use package.json version)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Determine Version & VersionCode
        id: resolve_version
        run: |
          PKG_VERSION=$(node -p "require('./frontend/package.json').version || '1.0.1'")
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          if [ -n "$INPUT_VERSION" ]; then
            APP_VERSION="$INPUT_VERSION"
          else
            APP_VERSION="$PKG_VERSION"
          fi
          
          # Strictly increasing integer for Android versionCode
          VERSION_CODE="${{ github.run_number }}"
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Resolved App Version: $APP_VERSION"
          echo "Resolved Version Code: $VERSION_CODE"

      - name: Validate Required Android Signing Secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.NEXA_KEYSTORE_BASE64 }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS NEXA_KEYSTORE_BASE64"
          fi
          if [ -z "${{ secrets.NEXA_RELEASE_STORE_PASSWORD }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS NEXA_RELEASE_STORE_PASSWORD"
          fi
          if [ -z "${{ secrets.NEXA_RELEASE_KEY_ALIAS }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS NEXA_RELEASE_KEY_ALIAS"
          fi
          if [ -z "${{ secrets.NEXA_RELEASE_KEY_PASSWORD }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS NEXA_RELEASE_KEY_PASSWORD"
          fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Required Android signing secret(s) missing:$MISSING_SECRETS. Workflow terminated. Never building or publishing an unsigned APK."
            exit 1
          fi

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore/nexa-release.keystore
          chmod 600 /tmp/keystore/nexa-release.keystore

      - name: Build Signed Release APK with Gradle
        working-directory: ./frontend/android
        env:
          KEYSTORE_PATH: /tmp/keystore/nexa-release.keystore
          STORE_PASSWORD: ${{ secrets.NEXA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "Building signed production release APK..."
          ./gradlew assembleRelease \
            -PNEXA_RELEASE_STORE_FILE="$KEYSTORE_PATH" \
            -PNEXA_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PNEXA_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PNEXA_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$APP_VERSION" \
            --no-daemon

      - name: Locate and Rename Release APK
        working-directory: ./frontend/android
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was generated by Gradle build."
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p app/build/outputs/apk/release
          if [ "$APK" != "app/build/outputs/apk/release/NEXA-Android.apk" ]; then
            cp "$APK" app/build/outputs/apk/release/NEXA-Android.apk
          fi
          echo "Final APK:"
          ls -lh app/build/outputs/apk/release/NEXA-Android.apk

      - name: Verify APK Integrity & Release Pre-flight
        env:
          EXPECTED_PACKAGE: "com.nexa.chat"
          EXPECTED_VERSION: "${{ env.APP_VERSION }}"
        run: |
          APK_FILE="frontend/android/app/build/outputs/apk/release/NEXA-Android.apk"
          
          # 1. Verify APK file exists and has non-zero size
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK file not found or is 0 bytes at $APK_FILE"
            exit 1
          fi
          
          # 2. Run apksigner verification
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Verifying APK signature using $BUILD_TOOLS_DIR/apksigner..."
          SIGN_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_FILE" 2>&1)
          echo "$SIGN_OUTPUT"
          if ! echo "$SIGN_OUTPUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "::error::APK signature verification failed! Not signed with production key."
            exit 1
          fi
          
          # 3. Verify Package ID and Version Name with aapt
          AAPT_OUTPUT=$("$BUILD_TOOLS_DIR/aapt" dump badging "$APK_FILE")
          if ! echo "$AAPT_OUTPUT" | grep -q "package: name='$EXPECTED_PACKAGE'"; then
            echo "::error::Package ID mismatch! Expected $EXPECTED_PACKAGE"
            exit 1
          fi
          if ! echo "$AAPT_OUTPUT" | grep -q "versionName='$EXPECTED_VERSION'"; then
            echo "::error::VersionName mismatch! Expected $EXPECTED_VERSION"
            exit 1
          fi
          
          echo "All pre-release security and package verifications passed successfully."

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf /tmp/keystore

      - name: Upload APK as Actions Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Android-v${{ env.APP_VERSION }}-build${{ env.VERSION_CODE }}
          path: frontend/android/app/build/outputs/apk/release/NEXA-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "NEXA v${{ env.APP_VERSION }}"
          body: |
            ### 🚀 NEXA Android & Web Release v${{ env.APP_VERSION }}

            Continuous automated production build directly from `frontend/` source of truth.

            #### 📦 Release Details:
            - **Package ID:** `com.nexa.chat`
            - **Version Name:** `v${{ env.APP_VERSION }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Web Deployment:** [https://nexa-chat-tau.vercel.app](https://nexa-chat-tau.vercel.app)
            - **Official Download Page:** [https://nexa-chat-tau.vercel.app/download](https://nexa-chat-tau.vercel.app/download)

            #### 📲 Direct APK Download:
            - **[Download NEXA-Android.apk](https://github.com/Aakash-18-2006/Nexa-Chat-/releases/latest/download/NEXA-Android.apk)**
          files: |
            frontend/android/app/build/outputs/apk/release/NEXA-Android.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
