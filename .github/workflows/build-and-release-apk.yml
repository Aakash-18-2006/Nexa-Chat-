name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-and-release-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Restore release keystore
        working-directory: frontend/android
        env:
          NEXA_KEYSTORE_BASE64: ${{ secrets.NEXA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEXA_KEYSTORE_BASE64" ]; then
            echo "ERROR: NEXA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$NEXA_KEYSTORE_BASE64" | base64 --decode > app/nexa-release.keystore

          if [ ! -s app/nexa-release.keystore ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          NEXA_RELEASE_STORE_FILE: ${{ github.workspace }}/frontend/android/app/nexa-release.keystore
          NEXA_RELEASE_STORE_PASSWORD: ${{ secrets.NEXA_RELEASE_STORE_PASSWORD }}
          NEXA_RELEASE_KEY_ALIAS: ${{ secrets.NEXA_RELEASE_KEY_ALIAS }}
          NEXA_RELEASE_KEY_PASSWORD: ${{ secrets.NEXA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -PNEXA_RELEASE_STORE_FILE="$NEXA_RELEASE_STORE_FILE" \
            -PNEXA_RELEASE_STORE_PASSWORD="$NEXA_RELEASE_STORE_PASSWORD" \
            -PNEXA_RELEASE_KEY_ALIAS="$NEXA_RELEASE_KEY_ALIAS" \
            -PNEXA_RELEASE_KEY_PASSWORD="$NEXA_RELEASE_KEY_PASSWORD"

      - name: Verify APK signature
        working-directory: frontend/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        working-directory: frontend/android
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/NEXA-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Android
          path: frontend/android/app/build/outputs/apk/release/NEXA-Android.apk
